spring.application.name=bookmylab
server.port=${PORT:8080}

# Storage: embedded file database, created automatically on first run
spring.datasource.url=jdbc:h2:file:./data/bookmylab;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT (Exp 8). Override JWT_SECRET in production (min 32 characters).
jwt.secret=${JWT_SECRET:bookmylab-demo-secret-key-change-me-in-production-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jackson.serialization.write-dates-as-timestamps=false
